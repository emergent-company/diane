name: Diane
options:
  bundleIdPrefix: com.emergent-company.diane-companion
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  indentWidth: 4
  tabWidth: 4

settings:
    base:
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.diane.ios
        DEVELOPMENT_TEAM: "74LC88G9SC"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: 1.42.0
        CURRENT_PROJECT_VERSION: 1
        ALWAYS_SEARCH_USER_PATHS: NO
        # Produce separate .dSYM bundles in all configurations so Sentry can
        # symbolicate simulator hangs / crashes too (default for Debug is "dwarf" only).
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.0.0
  DianeShared:
    path: ../Packages/DianeShared
  ExyteChat:
    path: ../Packages/ExyteChat

targets:
  Diane:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: DianeCompanion/Assets.xcassets
      - path: DianeCompanion/LaunchScreen.storyboard
    dependencies:
      - package: Sentry
        product: Sentry
      - package: DianeShared
        product: DianeShared
      - package: ExyteChat
        product: ExyteChat
    settings:
      base:
        PRODUCT_NAME: Diane
        INFOPLIST_FILE: DianeCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: DianeCompanion/DianeCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
    postbuildScripts:
      - name: "Ad-hoc sign embedded frameworks (archive workaround)"
        script: |
          # Sentry.framework is unsigned when CODE_SIGNING_ALLOWED=NO.
          # Give it an ad-hoc signature so xcodebuild -exportArchive can
          # re-sign it with the distribution cert for App Store upload.
          FW="$CODESIGNING_FOLDER_PATH/Frameworks/Sentry.framework"
          if [ -d "$FW" ]; then
            codesign --force --sign - --verbose "$FW"
          fi
        basedOnDependencyAnalysis: NO
      - name: "Sentry: Upload Debug Symbols"
        script: |
          # Reads auth_token / org / project from .sentryclirc at the project root.
          if [[ "$(uname -m)" == arm64 ]]; then
              export PATH="/opt/homebrew/bin:$PATH"
          fi
          if which sentry-cli >/dev/null; then
              export SENTRY_ORG=diane-6t
              export SENTRY_PROJECT=apple-ios
              ERROR=$(sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" 2>&1 >/dev/null)
              if [ ! $? -eq 0 ]; then
                  echo "warning: sentry-cli - $ERROR"
              fi
          else
              echo "warning: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases"
          fi
        basedOnDependencyAnalysis: NO
    info:
      path: DianeCompanion/Info.plist
      properties:
        UILaunchScreen: { }
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: ["UIInterfaceOrientationPortrait"]
        UISupportedInterfaceOrientations~ipad:
          - "UIInterfaceOrientationPortrait"
          - "UIInterfaceOrientationPortraitUpsideDown"
          - "UIInterfaceOrientationLandscapeLeft"
          - "UIInterfaceOrientationLandscapeRight"

  DianeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DianeTests
    dependencies:
      - target: Diane
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  DianeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DianeUITests
    dependencies:
      - target: Diane
    settings:
      base:
        PRODUCT_NAME: DianeUITests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.diane.ios.uitests
        TEST_TARGET_NAME: Diane
