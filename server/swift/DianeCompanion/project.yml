name: Diane
options:
  bundleIdPrefix: com.emergent-company
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  indentWidth: 4
  tabWidth: 4

settings:
    base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.emergent-company.diane-companion
        DEVELOPMENT_TEAM: "74LC88G9SC"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_MODULE_ARCHIVE: NO
        OTHER_LDFLAGS: "-Wl,-w"
        OTHER_SWIFT_FLAGS: "-Xlinker -w"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.9.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    version: 8.45.0
  Textual:
    url: https://github.com/gonzalezreal/textual
    version: 0.3.1
  ExyteChat:
    path: ../Packages/ExyteChat

targets:
  Diane:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: Sentry
        product: Sentry
      - package: Textual
        product: Textual
    settings:
      base:
        PRODUCT_NAME: Diane
        INFOPLIST_FILE: DianeCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: DianeCompanion/DianeCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.38.32
        CURRENT_PROJECT_VERSION: 2
      configs:
        Debug:
          OTHER_LDFLAGS: "-Wl,-w"
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
    postbuildScripts:
      - script: |
          # Bundle diane CLI binary into the app bundle's Resources directory.
          # CI places the binary at SRCROOT/Resources/diane before building; local
          # builds fall back to downloading the latest release binary.
          ARCH=$(uname -m)
          RESOURCES="${TARGET_BUILD_DIR}/${PRODUCT_NAME}.app/Contents/Resources"
          mkdir -p "$RESOURCES"

          # Prefer CI-provided binary from source Resources/ (correct version for this build)
          if [ -f "${SRCROOT}/Resources/diane" ] && [ -s "${SRCROOT}/Resources/diane" ]; then
            echo "diane binary found in source Resources/ (CI) — copying to build output"
            cp "${SRCROOT}/Resources/diane" "${RESOURCES}/diane"
            chmod +x "${RESOURCES}/diane"
          # Next, check if already in build output (e.g. re-run)
          elif [ -f "${RESOURCES}/diane" ] && [ -s "${RESOURCES}/diane" ]; then
            echo "diane binary already present in build output (size: $(stat -f%z "${RESOURCES}/diane")) — skipping"
            chmod +x "${RESOURCES}/diane"
          else
            if [ "$ARCH" = "arm64" ]; then
              BINARY="diane-darwin-arm64.tar.gz"
            else
              BINARY="diane-darwin-amd64.tar.gz"
            fi
            echo "Downloading ${BINARY} from latest release..."
            curl -sL --connect-timeout 10 -o "/tmp/${BINARY}" "https://github.com/emergent-company/diane/releases/latest/download/${BINARY}"
            tar xzf "/tmp/${BINARY}" -C "${RESOURCES}" 2>/dev/null && echo "Extracted ${BINARY}" || echo "Warning: download failed, diane CLI not bundled"
            rm -f "/tmp/${BINARY}"
            chmod +x "${RESOURCES}/diane" 2>/dev/null || true
          fi
        name: "Download diane CLI"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(PRODUCT_NAME).app/Contents/Resources/diane"
    info:
      path: DianeCompanion/Info.plist
    entitlements:
      path: DianeCompanion/DianeCompanion.entitlements

  DianeUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: DianeUITests
    dependencies:
      - target: Diane
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.emergent-company.diane-companion.uitests
        USES_XCTRUNNER: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_MODULE_ARCHIVE: NO
        SWIFT_INSTALL_OBJC_HEADER: NO
        CODE_SIGNING_ALLOWED: NO
    postbuildScripts:
      - script: |
          # Re-sign the entire XCUITest runner with consistent ad-hoc identity
          RUNNER="${TARGET_BUILD_DIR}/DianeUITests-Runner.app"
          if [ -d "$RUNNER" ]; then
            # Sign runner app first, then all nested plugins
            codesign --force --sign - --preserve-metadata=identifier,entitlements \
              "${RUNNER}/Contents/PlugIns/DianeUITests.xctest" 2>/dev/null || true
            codesign --force --sign - --preserve-metadata=identifier,entitlements \
              --deep "$RUNNER"
            echo "Re-signed XCUITest runner + plugins with consistent ad-hoc identity"
          fi
        name: "Re-sign XCUITest bundle identically"
