name: Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/unit-tests.yml'

concurrency:
  group: unit-tests-${{ github.ref_name || github.sha }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.23'

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Vet
        run: go vet ./...
        working-directory: server

      - name: Unit tests
        run: go test -count=1 -timeout=60s ./internal/...
        working-directory: server
