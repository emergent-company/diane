name: CI — Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: vet + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: go vet
        run: go vet ./internal/... ./cmd/...

      - name: Unit tests
        run: go test -count=1 -v ./internal/... ./cmd/... 2>&1 | tail -20
