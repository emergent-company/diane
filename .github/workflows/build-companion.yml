name: Build Companion (preview)

on:
  push:
    branches: [main]
    paths:
      - 'server/swift/DianeCompanion/Sources/**'
      - 'server/swift/DianeCompanion/Diane.xcodeproj/**'
      - 'server/swift/DianeCompanion/Scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-companion:
    name: Build Companion App
    runs-on: [self-hosted, macos-arm64, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Install tools
        run: |
          brew list xcodegen &>/dev/null || brew install xcodegen
          brew list create-dmg &>/dev/null || brew install create-dmg

      - name: Download diane binary
        uses: actions/download-artifact@v4
        with:
          name: diane-darwin-arm64
          path: server/swift/DianeCompanion/Resources/
        continue-on-error: true

      - name: Extract binary (if artifact available)
        run: |
          if ls server/swift/DianeCompanion/Resources/*.tar.gz 2>/dev/null; then
            cd server/swift/DianeCompanion/Resources
            for f in *.tar.gz; do tar xzf "$f"; done
            chmod +x diane 2>/dev/null || true
            rm -f *.tar.gz
          fi
        continue-on-error: true

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: server/swift/DianeCompanion

      - name: Build (unsigned preview)
        id: build
        run: |
          mkdir -p build
          ./Scripts/build-dmg.sh --no-sign 2>&1 | tee build/build-log.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            first_errors=$(grep -E "(error:|❌|BUILD FAILED|CompileSwift)" build/build-log.txt | head -5)
            if [ -n "$first_errors" ]; then
              echo "$first_errors" | while read line; do
                echo "::error::Build error: $line"
              done
            fi
          fi
          exit $exit_code
        working-directory: server/swift/DianeCompanion
        env:
          VERSION: preview-${{ github.sha }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: diane-companion-preview-${{ github.sha }}
          path: server/swift/DianeCompanion/build/Diane-*.dmg
          retention-days: 14

      - name: Upload xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: diane-companion-archive-${{ github.sha }}
          path: server/swift/DianeCompanion/build/Diane.xcarchive
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: companion-build-log-${{ github.sha }}
          path: server/swift/DianeCompanion/build/build-log.txt
